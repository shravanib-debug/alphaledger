# AlphaLedger local stack: infrastructure, platform services, auth-, portfolio-, trade-, position- and valuation-service.
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d --build
# Business services are added here as their phases land; Compose profiles arrive in Phase 9.

name: alphaledger

x-java-service: &java-service
  build:
    context: ..
    dockerfile: infra/docker/service.Dockerfile
  restart: unless-stopped
  environment: &java-env
    # Inside the Compose network every Java service listens on 8080; host ports differ (see `ports`).
    EUREKA_URL: http://discovery-server:8080/eureka
    CONFIG_SERVER_URL: http://config-server:8080
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    # Local-development signing key only. Override in infra/.env for anything shared (see infra/.env.example).
    JWT_SECRET: ${JWT_SECRET:-rI0r1utFpB/WAXCpUz7oTxyCYdJu5Y++uXHT0UwueEbDiXLZIke/+rDAKgn6U8bq}
  healthcheck: &java-health
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphaledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"   # for tools on the host; containers use kafka:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # No volume: topics are recreated on each start in local development.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: alphaledger-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # ---------- Platform services ----------
  discovery-server:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: discovery-server
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8080"

  config-server:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: config-server
    environment:
      <<: *java-env
      SERVER_PORT: 8080
    ports:
      - "8888:8080"
    depends_on:
      discovery-server:
        condition: service_healthy

  api-gateway:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: api-gateway
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ---------- Business services ----------
  auth-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: auth-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      SEED_DEMO_USERS: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo@AlphaLedger2026}
      # Browser sessions (docs/auth-session.md). The local stack is plain HTTP, so the refresh cookie cannot be
      # Secure here; any deployed environment is HTTPS and keeps the default (true).
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ALLOWED_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  portfolio-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: portfolio-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      SEED_DEMO_DATA: "true"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  trade-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: trade-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  valuation-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: valuation-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKETDATA_MODE: OFFLINE
      MARKETDATA_NETWORK_ENABLED: "false"
      MARKETDATA_INTRADAY_TICKS: ${MARKETDATA_INTRADAY_TICKS:-false}
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  position-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: position-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  reconciliation-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: reconciliation-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: notification-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Nightly ETL (02:00 IST) from the services' databases into analytics_db; read-only connections (ADR 23).
  analytics-service:
    <<: *java-service
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: analytics-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-alphaledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-alphaledger}
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ---------- Dashboard ----------
  # React app on nginx; /api is proxied to the gateway on the same origin (frontend/nginx.conf).
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:

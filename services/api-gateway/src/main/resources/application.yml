server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                # The dashboard (nginx :3000) and the Vite dev server (:5173). Cookie-mode auth also checks Origin
                # in auth-service (docs/auth-session.md).
                allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Correlation-Id
                allow-credentials: true
          # Safe (GET) requests are retried on connection errors and server errors (5xx); writes never are, so a trade is
          # not submitted twice.
          default-filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
          # Routes follow architecture.md §7.1. Each route has its own circuit breaker (named after the route), so one
          # failing service does not cut off the others; while open, callers get a 503 JSON error at once. Order matters: the portfolio sub-resources owned by
          # position-service and valuation-service must be matched before the portfolio catch-all.
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: position-service
              uri: lb://position-service
              predicates:
                - Path=/api/v1/portfolios/*/positions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: position-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: valuation-service
              uri: lb://valuation-service
              predicates:
                - Path=/api/v1/portfolios/*/valuation/**,/api/v1/portfolios/*/cash/**,/api/v1/portfolios/*/liabilities/**,/api/v1/portfolios/*/exposure/**,/api/v1/marketdata/**,/api/v1/valuations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: valuation-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: portfolio-service
              uri: lb://portfolio-service
              predicates:
                - Path=/api/v1/portfolios/**,/api/v1/instruments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: portfolio-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: trade-service
              uri: lb://trade-service
              predicates:
                - Path=/api/v1/trades/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: trade-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: reconciliation-service
              uri: lb://reconciliation-service
              predicates:
                - Path=/api/v1/recon/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reconciliation-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/ops/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            - id: analytics-service
              uri: lb://analytics-service
              predicates:
                - Path=/api/v1/analytics/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: analytics-service
                    fallbackUri: forward:/fallback/unavailable
                    statusCodes: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
            # Smoke-test route: proves gateway -> Eureka -> service routing before any business API exists.
            - id: ping-portfolio
              uri: lb://portfolio-service
              predicates:
                - Path=/api/v1/ping/portfolio
              filters:
                - SetPath=/actuator/health

# One breaker per route: opens when half of the last 20 calls (at least 10) failed or timed out, stays open 10 s,
# then lets 3 trial calls through. 30 s time limit: uploads and end-of-day runs can be slow.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 30s

alphaledger:
  gateway:
    rate-limit:
      enabled: true
      capacity: 100          # burst per caller (user ID, or client IP before login)
      refill-per-second: 20  # sustained requests a second per caller
  security:
    jwt:
      secret: ${JWT_SECRET:}   # Base64 HMAC key, >= 32 bytes; never committed (see infra/.env.example)

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

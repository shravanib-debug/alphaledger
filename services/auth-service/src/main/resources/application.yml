server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    # Shared settings come from config-server; the service still starts if it is down.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:alphaledger}
    password: ${DB_PASSWORD:alphaledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema

alphaledger:
  security:
    jwt:
      secret: ${JWT_SECRET:}   # Base64 HMAC key, >= 32 bytes; never committed (see infra/.env.example)
    additional-public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
  auth:
    # Browser sessions (docs/auth-session.md): refresh token in an HttpOnly, SameSite=Strict cookie.
    session:
      cookie-secure: ${AUTH_COOKIE_SECURE:true}   # false only for plain-HTTP local development
      cookie-path: /api/v1/auth
      allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      replay-window: 30s                          # lost-response retry with the same Idempotency-Key; 0 disables
  seed:
    demo-users:
      enabled: ${SEED_DEMO_USERS:false}
      password: ${DEMO_USER_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

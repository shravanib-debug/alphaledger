server:
  port: 8085

spring:
  application:
    name: valuation-service
  config:
    # Shared settings come from config-server; the service still starts if it is down.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/valuation_db
    username: ${DB_USER:alphaledger}
    password: ${DB_PASSWORD:alphaledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  servlet:
    multipart:
      max-file-size: 2MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: valuation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  batch:
    job:
      enabled: false             # jobs run on schedule or on request, not at startup
    jdbc:
      initialize-schema: never   # Flyway creates the batch tables (V4)

alphaledger:
  security:
    jwt:
      secret: ${JWT_SECRET:}   # Base64 HMAC key, >= 32 bytes; never committed (see infra/.env.example)
  market:
    zone: Asia/Kolkata
  valuation:
    eod-cron: "0 0 20 * * MON-FRI"   # after the 19:30 daily price run
  outbox:
    relay:
      poll-interval-ms: 500
  marketdata:
    mode: ${MARKETDATA_MODE:OFFLINE}          # OFFLINE (local demo, tests, CI) | LIVE
    network-enabled: ${MARKETDATA_NETWORK_ENABLED:false}
    max-staleness-business-days: 5
    seed-enabled: true                        # committed real seed prices + synthetic marks on startup
    intraday-ticks-enabled: ${MARKETDATA_INTRADAY_TICKS:false}
    daily-cron: "0 30 19 * * MON-FRI"
    # SYNTHETIC is allowed only for PRIVATE (synthetic instruments); startup fails otherwise.
    # NSE_BHAVCOPY, AMFI_NAV and MFAPI are skipped until their adapters exist (deferred part of Phase 4A).
    fallback-order:
      EQUITY: [NSE_BHAVCOPY]
      REIT: [NSE_BHAVCOPY]
      INVIT: [NSE_BHAVCOPY]
      GSEC: [NSE_BHAVCOPY]
      BOND: [NSE_BHAVCOPY]
      MUTUAL_FUND: [AMFI_NAV, MFAPI]
      PRIVATE: [SYNTHETIC]

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Test profile: no config server or Eureka; Postgres comes from Testcontainers (@ServiceConnection).
spring:
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false

alphaledger:
  security:
    jwt:
      secret: dGVzdC1vbmx5LXNlY3JldC10ZXN0LW9ubHktc2VjcmV0LTEyMzQ1Ng==
  outbox:
    relay:
      poll-interval-ms: 200
  marketdata:
    mode: OFFLINE
    network-enabled: false
    sample-enabled: false   # tests that need the offline sample switch it on

server:
  port: 8086

spring:
  application:
    name: reconciliation-service
  config:
    # Shared settings come from config-server; the service still starts if it is down.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/recon_db
    username: ${DB_USER:alphaledger}
    password: ${DB_PASSWORD:alphaledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  batch:
    job:
      enabled: false             # runs start when a file is uploaded
    jdbc:
      initialize-schema: never   # Flyway creates the batch tables (V3)

alphaledger:
  security:
    jwt:
      secret: ${JWT_SECRET:}   # Base64 HMAC key, >= 32 bytes; never committed (see infra/.env.example)
  market:
    zone: Asia/Kolkata
  recon:
    price-tolerance: 0.01      # INR; quantities must match exactly
    sla-days: 3                # breaks open longer than this are flagged overdue
    batch:
      chunk-size: 500
      grid-size: 4             # parallel staging partitions; keep well below the connection pool size
      retry-limit: 3           # attempts after a transient database failure
      skip-limit: 100          # rows the database may refuse, per partition, before the run fails
      stale-after: PT30M       # RUNNING for longer than this means the instance died; must exceed the longest run
      recovery-interval-ms: 300000
  outbox:
    relay:
      poll-interval-ms: 500

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Standalone registry: it does not register with itself or fetch from peers.
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false   # local development: drop dead instances quickly

management:
  endpoints:
    web:
      exposure:
        include: health,info
